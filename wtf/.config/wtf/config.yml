wtf:
  colors:
    border:
      focusable: darkslateblue
      focused: orange
      normal: gray
  grid:
    columns: [32, 32, 32, 32, 90]
    rows: [10, 10, 10, 4, 4, 90]
  refreshInterval: 1
  mods:
    uptime:
      title: "Uptime"
      args: []
      cmd: "uptime"
      enabled: true
      position:
        top: 0
        left: 0
        height: 1
        width: 2
      refreshInterval: 30
      type: cmdrunner
    power:
      enabled: true
      position:
        top: 0
        left: 2
        height: 1
        width: 1
      refreshInterval: 15
      title: "Power"
    digitalclock:
      enabled: true
      title: "Date/Time"
      position:
        top: 1
        left: 0
        height: 2
        width: 2
      color: orange
      font: bigfont
      withEpoch: true
      withUTC: true
      refreshInterval: 1
      type: "digitalclock"
    ipinfo:
      colors:
        name: "lightblue"
        value: "white"
      enabled: true
      position:
        top: 1
        left: 2
        height: 1
        width: 1
      refreshInterval: 150
